[workspace]
name = "robotech"
version = "0.1.0"
description = "Robotech: SDF-1 Veritech 3D Combat & Transformation Simulator powered by Flint Engine (Pure Mojo 1.2)"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = ">=1.2.0,<1.3"

[tasks]
build = "bash tools/run.sh build"
play = "bash tools/run.sh play"
test = "bash tools/run.sh test"
shot = "bash tools/run.sh shot"
gate = "bash tools/run.sh gate"
